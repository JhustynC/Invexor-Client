<!-- Botón flotante del chatbot -->
<div id="chat-toggle"
     (click)="openChatbot()"
     class="fixed bottom-[65px] lg:bottom-5 right-3 lg:right-5 z-[999] w-[60px] h-[60px] border border-white rounded-full bg-[#111827] grid place-content-center hover:bg-[#374151] cursor-pointer transition">
  <img src="bot-img.svg"
       alt="bot-image"
       class="h-8">
</div>

<!--* Contenedor del chat (oculto por defecto) -->
<div id="chat-box"
     #chatMessages
     class="border-1 border-white fixed bottom-[135px] right-3 lg:bottom-[85px] lg:right-[50px] z-[998] w-[300px] max-h-[400px] bg-[#111827] rounded-2xl shadow-lg flex flex-col overflow-hidden h-[300px]">

  <!--? Encabezado del chat -->
  <div class="bg-[#1f2937] text-white px-4 py-2 font-semibold text-lg flex items-center justify-between">
    <span>{{ isApiConfigured() ? 'Invexor AI' : 'Chatbot (Modo Básico)' }}</span>
    @if (isApiConfigured()) {
      <span class="text-xs bg-green-600 px-2 py-1 rounded-full">IA Activa</span>
    } @else {
      <span class="text-xs bg-yellow-600 px-2 py-1 rounded-full">Sin IA</span>
    }
  </div>

  <!--? Cuerpo del chat -->
  <div id="chat-messages"
       class="flex-1 p-4 overflow-y-scroll text-white space-y-2 text-sm h-[200px]">

    @for(msg of messages; track $index){
    <chat-message [from]="msg.from"
                  [message]="msg.message"
                  [time]="msg.time"
                  [side]="msg.side">
    </chat-message>
    }
  </div>
  <!--? Input para enviar mensaje -->
  <div class="flex border-t border-gray-700">
    <input type="text"
           id="chat-input"
           [(ngModel)]="message"
           name="message"
           placeholder="{{ isLoading() ? 'Esperando respuesta...' : 'Escribe un mensaje...' }}"
           class="flex-1 p-2 text-white text-sm focus:outline-none bg-transparent"
           [disabled]="isLoading()"
           (keydown.enter)="sendMessage()">
    <button (click)="sendMessage()"
            [disabled]="isLoading() || !message().trim()"
            class="px-4 py-2 text-white text-sm transition-colors"
            [class]="isLoading() || !message().trim() ? 'bg-gray-600 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'">
      @if (isLoading()) {
        <span class="flex items-center gap-1">
          <svg class="animate-spin h-3 w-3" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          ...
        </span>
      } @else {
        Enviar
      }
    </button>
  </div>
</div>
